ruleset(name="remote") {
    if $msg contains ">SIP " then {
        # Don't log spamming OPTIONS and its ACK messages
        if $msg contains "012OPTIONS sip" or $msg contains "Record-Route" then {
            stop
        }

        # Uncomment to log full messages for debugging
        # action(type="omfile" file="/var/log/remote-debug" template="remoteTemplate")

        # We could also extract the IPs only but then we need 2 regexes what should reduce performance
        set $.fromto = re_extract($msg, "(from )([^<>]+)", 0, 2, "");
	    # set $.from = re_extract($msg, "(from )(([0-9]{1,3}\\.){3}[0-9]{1,3})", 0, 2, 0);
	    # set $.to = re_extract($msg, "(to ([0-9]{1,3}\\.){3}[0-9]{1,3})", 0, 1, 0);

        set $.status = re_extract($msg, "(#012#012)([^#]+)", 0, 2, "");
        set $.fromPhone = re_extract($msg, "((From: )([^;]+))", 0, 1, "");
        set $.toPhone = re_extract($msg, "((To: )([^;#]+))", 0, 1, "");
        # These were the first tries that work on the regex tester but don't on rocky9 - kept for reference
        # set $.fromPhone = re_extract($msg, "(From: .*?)(;)", 0, 1, "");
        # set $.toPhone = re_extract($msg, "(To: .*?)(;)", 0, 1, "");

        action(type="omfile" file="/var/log/remote" template="sipTemplate")

        stop
    }

    # All not SIP messages
    if $msg contains "MEM-CONN-ERROR" then {
        stop
    }

    action(type="omfile" file="/var/log/remote" template="remoteTemplate")

    stop
}

module(load="imudp") # needs to be done just once
input(type="imudp" port="514" ruleset="remote")
