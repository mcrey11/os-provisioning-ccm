# Regex docu: https://www.rsyslog.com/doc/configuration/property_replacer.html
# Attention: Don't test regex on recommended https://www.rsyslog.com/regex/ as engine can differ - so (.*?) non greedy operator doesnt
# work on e.g. rocky9 rsyslog - use [^;] for all chars but ";" to match until first occurence of ";"
# see https://heemayl.net/posts/regex-non-greedy-operation-without-non-greedy-operators/
# Use bash script on same operating system to test regex!

# IDEA: We could also reduce server load by letting user enable this on demand as debugging mode (checkbox in global config that when checked
# puts this file in /etc/rsyslog.d/ and restarts rsyslog)

# Template docu: https://www.rsyslog.com/doc/configuration/templates.html
# $template remoteTemplate,"%$year%-%$month%-%$day% %timegenerated:12:19:date-rfc3339% %syslogseverity-text% %HOSTNAME% %syslogtag%  %msg:0:500%\n"
# $template sipTemplate,"%$year%-%$month%-%$day% %timegenerated:12:19:date-rfc3339% %syslogseverity-text% %HOSTNAME% %syslogtag% %.fromto% %.status%  %.fromPhone% %.toPhone%\n"
$template remoteTemplate,"%timegenerated:date-rfc3164% %syslogseverity-text% %HOSTNAME% %syslogtag%  %msg:0:500%\n"
$template sipTemplate,"%timegenerated:date-rfc3164% %syslogseverity-text% %HOSTNAME% %syslogtag% %.fromto% %.status%  %.fromPhone% %.toPhone%\n"


